<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Studio — Client Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: oklch(0.985 0.005 80);
    --panel: oklch(0.975 0.006 80);
    --panel-2: oklch(0.96 0.007 80);
    --ink: oklch(0.18 0.01 80);
    --ink-2: oklch(0.42 0.01 80);
    --ink-3: oklch(0.62 0.008 80);
    --line: oklch(0.9 0.005 80);
    --line-2: oklch(0.93 0.005 80);
    --accent: oklch(0.55 0.15 264);
    --accent-soft: oklch(0.95 0.03 264);
    --ok: oklch(0.62 0.13 150);
    --warn: oklch(0.7 0.14 70);
    --radius: 10px;
    --sans: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    height: 100%;
  }
  button { font-family: inherit; }
  #root { height: 100vh; overflow: hidden; }
</style>
</head>
<body>
  <div id="root"></div>

  <script>
    // EDITMODE persisted defaults
    window.__TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accent": "#5b6ee8",
      "density": "comfortable",
      "showSidebar": true,
      "showTokens": true,
      "layout": "split"
    }/*EDITMODE-END*/;
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
